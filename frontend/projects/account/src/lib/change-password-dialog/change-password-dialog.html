<form novalidate (ngSubmit)="submit()">
  <ph-dialog
    title="Change your password"
    description="Your other devices are signed out. You stay signed in here."
    icon="lock"
  >
    <div class="stack">
      @if (failed()) {
        <ph-alert
          tone="danger"
          title="That didn’t go through"
          text="Your password is unchanged. Try again."
        />
      }
      <ph-text-field
        inputId="current"
        label="Current password"
        name="current"
        type="password"
        autocomplete="current-password"
        [error]="errors()['current'] ?? null"
        [(ngModel)]="current"
      />
      <ph-text-field
        inputId="password"
        label="New password"
        name="password"
        type="password"
        autocomplete="new-password"
        help="At least 12 characters, and not your email."
        [error]="errors()['password'] ?? null"
        [(ngModel)]="password"
      />
      <ph-text-field
        inputId="repeat"
        label="Repeat it"
        name="repeat"
        type="password"
        autocomplete="new-password"
        [error]="errors()['repeat'] ?? null"
        [(ngModel)]="repeat"
      />
    </div>
    <ng-container ngProjectAs="[phDialogFooter]">
      <ph-button (click)="ref.close()">Cancel</ph-button>
      <ph-button variant="primary" type="submit" [busy]="busy()">Change password</ph-button>
    </ng-container>
  </ph-dialog>
</form>
