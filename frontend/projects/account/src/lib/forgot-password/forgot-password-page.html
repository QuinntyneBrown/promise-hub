<ph-skip-link />
<main id="main">
  @if (sentTo(); as email) {
    <ph-auth-card
      title="Check your email"
      [subtitle]="
        'If ' +
        masked(email) +
        ' has an account, a link is on its way. It works once, for one hour.'
      "
    >
      <div class="stack">
        <ph-button variant="primary" size="lg" [block]="true" link="/sign-in"
          >Back to sign in</ph-button
        >
        <p class="text-center text-muted">Didn’t get it? Check spam, or</p>
        <ph-button variant="ghost" [busy]="busy()" (click)="resend()">Resend the email</ph-button>
      </div>
    </ph-auth-card>
  } @else {
    <ph-auth-card title="Reset your password" subtitle="The link works for one hour.">
      <form class="stack" novalidate (ngSubmit)="submit()">
        @if (failed()) {
          <ph-alert
            tone="danger"
            title="We couldn’t send the email"
            text="Try again in a moment."
          />
        }
        <ph-text-field
          inputId="email"
          label="Email"
          type="email"
          autocomplete="username"
          name="email"
          [error]="error()"
          [(ngModel)]="email"
        />
        <ph-button variant="primary" size="lg" type="submit" [block]="true" [busy]="busy()"
          >Email me a reset link</ph-button
        >
        <p class="text-center"><a href="/sign-in">Back to sign in</a></p>
      </form>
    </ph-auth-card>
  }
</main>
