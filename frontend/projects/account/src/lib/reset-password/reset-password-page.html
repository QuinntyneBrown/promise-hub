@let c = check();
<ph-skip-link />
<main id="main">
  @if (c?.status === 'ok') {
    @if (c.status === 'ok') {
      <ph-auth-card title="Choose a new password" [subtitle]="'For ' + c.email">
        <form class="stack" novalidate (ngSubmit)="submit()">
          @if (failed()) {
            <ph-alert tone="danger" title="That didn’t save" text="Try again in a moment." />
          }
          <ph-text-field
            inputId="password"
            label="New password"
            type="password"
            autocomplete="new-password"
            help="At least 12 characters. Other devices are signed out."
            name="password"
            [error]="errors()['password'] ?? null"
            [(ngModel)]="password"
          />
          <ph-text-field
            inputId="repeat"
            label="Repeat it"
            type="password"
            autocomplete="new-password"
            name="repeat"
            [error]="errors()['repeat'] ?? null"
            [(ngModel)]="repeat"
          />
          <ph-button variant="primary" size="lg" type="submit" [block]="true" [busy]="busy()"
            >Set password and sign in</ph-button
          >
        </form>
      </ph-auth-card>
    }
  } @else if (c?.status === 'gone') {
    <ph-auth-card title="This link has expired" subtitle="Links work once, for one hour.">
      <ph-button variant="primary" size="lg" [block]="true" link="/forgot-password"
        >Send a new link</ph-button
      >
    </ph-auth-card>
  } @else if (c?.status === 'error') {
    <ph-auth-card title="We couldn’t check this link" subtitle="Try again in a moment.">
      <ph-button variant="primary" size="lg" [block]="true" link="/forgot-password"
        >Send a new link</ph-button
      >
    </ph-auth-card>
  } @else {
    <ph-auth-card title="Checking your link…" />
  }
</main>
