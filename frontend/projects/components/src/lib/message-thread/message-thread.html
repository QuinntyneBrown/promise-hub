<ol class="log" [attr.aria-label]="label()" aria-live="polite">
  @for (m of messages(); track m.id) {
    @if (m.day) {
      <li class="day">{{ m.day }}</li>
    }
    <li
      class="message"
      [class.mine]="m.mine"
      [class.new]="m.state === 'new'"
      [attr.data-state]="m.state ?? null"
    >
      <p class="bubble">{{ m.body }}</p>
      <span class="meta" [class.failed]="m.state === 'failed'">
        @if (m.state === 'failed') {
          Not sent.
          <ph-button variant="ghost" size="sm" (click)="retry.emit(m.id)">Try again</ph-button>
        } @else {
          {{ m.meta }}
        }
      </span>
    </li>
  }
</ol>
@if (composer()) {
  <form class="composer" [attr.aria-label]="'Write a message'" (ngSubmit)="submit()">
    <ph-textarea
      class="field"
      inputId="message-body"
      label="Message"
      name="body"
      [rows]="2"
      [error]="error()"
      [ngModel]="draft()"
      [disabled]="disabled()"
      (ngModelChange)="draft.set($event ?? '')"
      (keydown)="keydown($event)"
    />
    <ph-button variant="primary" icon="send" type="submit" [busy]="busy()" [disabled]="disabled()"
      >Send</ph-button
    >
  </form>
}
