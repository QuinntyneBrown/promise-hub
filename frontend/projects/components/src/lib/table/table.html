<div
  class="wrap"
  [class.wrap--flush]="flush()"
  tabindex="0"
  [attr.aria-label]="caption()"
  role="region"
>
  <table class="table">
    <caption class="visually-hidden">
      {{
        caption()
      }}
    </caption>
    <thead>
      <tr>
        @for (c of columns(); track c.key) {
          <th scope="col">{{ c.label }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track $index) {
        <tr>
          @for (c of columns(); track c.key) {
            <td>
              @if (badge(row[c.key] ?? null); as b) {
                <ph-badge [tone]="b.tone">{{ b.text }}</ph-badge>
              } @else {
                {{ text(row[c.key] ?? null) }}
              }
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
