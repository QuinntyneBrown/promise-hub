<figure class="player" [attr.aria-label]="label() + ', lesson video'">
  <div class="frame">
    @if (failed()) {
      <div class="failed">
        <ph-alert
          tone="warning"
          title="The video couldn’t load"
          text="The lesson text is all still here."
        >
          <ph-button size="sm" icon="refresh" (click)="retry()">Retry video</ph-button>
        </ph-alert>
      </div>
    } @else {
      <video
        controls
        preload="metadata"
        [src]="src()"
        [attr.aria-label]="label()"
        (error)="failed.set(true)"
      ></video>
    }
  </div>
  <figcaption class="caption">
    <span>{{ label() }}</span>
    <span>Lesson video</span>
  </figcaption>
</figure>
