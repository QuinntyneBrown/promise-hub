<label class="switch">
  <input
    type="checkbox"
    role="switch"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="error() ? id + '-error' : null"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="toggle($any($event.target).checked)"
    (blur)="onTouched()"
  />
  <span class="text" [class.visually-hidden]="labelHidden()">{{ label() }}</span>
</label>
@if (error()) {
  <div class="error" [id]="id + '-error'">{{ error() }}</div>
}
