<div class="mapping" role="table" aria-label="Column mapping">
  <div class="row head" role="row">
    <span role="columnheader">Your column</span>
    <span role="columnheader"><span class="visually-hidden">Becomes</span></span>
    <span role="columnheader">PromiseHub field</span>
  </div>
  @for (r of rows(); track r.column) {
    <div class="row" role="row">
      <div role="cell">
        <span class="source">{{ r.column }}</span>
        @if (r.sample) {
          <span class="sample">e.g. {{ r.sample }}</span>
        }
        @if (!r.matched) {
          <span class="sample">Not matched</span>
        }
      </div>
      <span role="cell" aria-hidden="true"><ph-icon name="arrow-right" /></span>
      <div role="cell">
        <label class="visually-hidden" [for]="id(r.column)">Map {{ r.column }}</label>
        <select
          class="select"
          [id]="id(r.column)"
          (change)="changed.emit({ column: r.column, value: $any($event.target).value })"
        >
          @for (o of options(); track o.value) {
            <option [value]="o.value" [selected]="o.value === r.value">{{ o.label }}</option>
          }
        </select>
      </div>
    </div>
  }
</div>
