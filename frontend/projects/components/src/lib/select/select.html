<label class="label" [class.visually-hidden]="labelHidden()" [for]="inputId()">{{ label() }}</label>
<select
  class="select"
  [id]="inputId()"
  [disabled]="disabled()"
  [attr.aria-invalid]="error() ? 'true' : null"
  [attr.aria-describedby]="error() ? inputId() + '-error' : help() ? inputId() + '-help' : null"
  (change)="update($any($event.target).value)"
  (blur)="onTouched()"
>
  @for (option of items(); track option.value) {
    <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
  }
</select>
@if (help()) {
  <div class="help" [id]="inputId() + '-help'">{{ help() }}</div>
}
@if (error()) {
  <div class="error" [id]="inputId() + '-error'" [attr.data-testid]="inputId() + '-error'">
    {{ error() }}
  </div>
}
