<fieldset class="group">
  <legend class="legend">{{ legend() }}</legend>
  @for (option of options(); track option.value) {
    <label class="choice">
      <input
        type="radio"
        [name]="name"
        [value]="option.value"
        [checked]="option.value === value()"
        [disabled]="disabled()"
        (change)="select(option.value)"
        (blur)="onTouched()"
      />
      <span class="text"
        >{{ option.label }}
        @if (option.hint) {
          <small>{{ option.hint }}</small>
        }
      </span>
    </label>
  }
</fieldset>
