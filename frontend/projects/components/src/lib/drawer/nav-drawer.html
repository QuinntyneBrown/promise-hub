<div class="nav-drawer__header">
  <span class="nav-drawer__title" id="menu-title">Menu</span>
  <button class="close" type="button" aria-label="Close menu" (click)="ref.close()">
    <ph-icon name="close" />
  </button>
</div>
<div class="nav-drawer__nav">
  @for (item of data.items; track item.link) {
    <a
      class="nav-drawer__link"
      [routerLink]="item.link"
      routerLinkActive
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: item.link === data.homeLink }"
      (click)="ref.close()"
    >
      <ph-icon [name]="item.icon" />{{ item.label }}
    </a>
  }
</div>
<div class="nav-drawer__identity" data-testid="menu-identity">
  <ph-avatar [name]="data.personName" size="sm" [tint]="data.avatarTint" />
  <div>
    <div class="name">{{ data.personName }}</div>
    <div class="context">{{ data.context }}</div>
  </div>
</div>
