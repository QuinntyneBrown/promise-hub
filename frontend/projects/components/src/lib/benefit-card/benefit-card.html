<ph-card>
  <div class="benefit">
    <div class="head">
      <h2 class="title">{{ name() }}</h2>
      <ph-badge [tone]="tone()">{{ state() }}</ph-badge>
    </div>
    <p class="meta">
      {{ level() }} · <strong>{{ amount() }}</strong>
    </p>
    @if (text()) {
      <p class="text">{{ text() }}</p>
    }
    <div class="action"><ng-content /></div>
    @if (source()) {
      <p class="source">{{ source() }}</p>
    }
  </div>
</ph-card>
