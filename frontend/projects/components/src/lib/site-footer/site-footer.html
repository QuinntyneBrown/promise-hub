<footer class="site-footer">
  <div class="row">
    <span class="brand">{{ organization() }}</span>
    <nav aria-label="Footer">
      @for (item of links(); track item.label) {
        <a [routerLink]="item.link">{{ item.label }}</a>
      }
    </nav>
  </div>
  @if (note()) {
    <p class="note">{{ note() }}</p>
  }
</footer>
