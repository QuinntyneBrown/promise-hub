<ph-avatar [name]="name()" size="sm" [tint]="avatarTint()" />
<div class="body">
  <div class="name">
    @if (link(); as target) {
      <a
        class="name-link"
        [routerLink]="target"
        [attr.aria-label]="'Quick Card for ' + name()"
        data-testid="roster-name"
        >{{ name() }}</a
      >
    } @else {
      <span data-testid="roster-name">{{ name() }}</span>
    }
    <ng-content select="[phRosterFlags]" />
  </div>
  @if (meta()) {
    <div class="meta">{{ meta() }}</div>
  }
</div>
<div class="actions"><ng-content /></div>
