<ph-dialog title="Correct attendance" [description]="description" icon="edit">
  <form class="stack" (ngSubmit)="save()">
    @if (summary().length) {
      <ph-error-summary title="Fix these to continue" [items]="summary()" />
    }
    @if (failed()) {
      <ph-alert
        tone="danger"
        title="That didn’t go through"
        text="The correction wasn’t saved. Everything is still here; try again."
      />
    }
    @if (errors()['session']; as session) {
      <ph-alert tone="warning" [title]="session" />
    }
    <ph-select
      inputId="correct-youth"
      label="Youth"
      name="youth"
      [options]="youth()"
      [error]="errors()['childId'] ?? null"
      [ngModel]="childId()"
      (ngModelChange)="childId.set($event)"
    />
    <div id="correct-status">
      <ph-radio-group
        legend="Mark as"
        name="status"
        [options]="marks"
        [error]="errors()['status'] ?? null"
        [ngModel]="status()"
        (ngModelChange)="status.set($event)"
      />
    </div>
    <ph-textarea
      inputId="correct-reason"
      label="Why are you correcting it?"
      name="reason"
      [rows]="3"
      help="Kept with the change in the audit log."
      [count]="count(reason())"
      [error]="errors()['reason'] ?? null"
      [ngModel]="reason()"
      (ngModelChange)="reason.set($event ?? '')"
    />
  </form>
  <ng-container ngProjectAs="[phDialogFooter]">
    <ph-button (click)="ref.close()">Cancel</ph-button>
    <ph-button variant="primary" [busy]="busy()" (click)="save()">Save correction</ph-button>
  </ng-container>
</ph-dialog>
