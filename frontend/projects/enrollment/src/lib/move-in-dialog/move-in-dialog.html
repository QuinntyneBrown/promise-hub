<form novalidate (ngSubmit)="submit()">
  <ph-dialog
    [title]="'Move ' + data.request.child + ' in?'"
    [description]="'Number ' + data.request.position + ' on the waitlist · ' + data.places"
  >
    @if (errors()['decision']; as message) {
      <ph-alert tone="danger" [title]="message" />
    }
    @if (failed()) {
      <ph-alert
        tone="danger"
        title="That didn’t go through"
        text="Nothing was changed. Try again."
      />
    }
    <ph-textarea
      inputId="move-in-note"
      label="Note to the guardian"
      name="note"
      [rows]="2"
      [optional]="true"
      [(ngModel)]="note"
    />
    <ng-container ngProjectAs="[phDialogFooter]">
      <ph-button (click)="ref.close()">Cancel</ph-button>
      <ph-button variant="primary" type="submit" [busy]="busy()"
        >Move in and text {{ first }}</ph-button
      >
    </ng-container>
  </ph-dialog>
</form>
