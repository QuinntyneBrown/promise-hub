@let r = result();
<ph-page-header title="Announcements" subtitle="News from your organization and your programs.">
  @if (unread()) {
    <ph-button icon="check" [busy]="busy()" (click)="markAllRead()">Mark all read</ph-button>
  }
</ph-page-header>
@if (markFailed()) {
  <ph-alert
    tone="danger"
    title="That didn’t go through"
    text="Your announcements are still marked new. Try again."
  />
}
@if (r === null) {
  <div class="stack" aria-busy="true" aria-label="Loading announcements">
    <ph-skeleton shape="card" />
    <ph-skeleton shape="card" />
  </div>
} @else if (r.status === 'loaded') {
  @if (r.value.announcements.length) {
    <ph-card [flush]="true">
      <ph-list label="Announcements, newest first">
        @for (a of r.value.announcements; track a.id) {
          <ph-list-item [title]="a.title" [text]="a.body" [caption]="caption(a)">
            @if (!a.read) {
              <ph-badge tone="info">New</ph-badge>
            }
          </ph-list-item>
        }
      </ph-list>
    </ph-card>
  } @else {
    <ph-card [flush]="true">
      <ph-empty-state
        icon="messages"
        title="No announcements yet"
        text="News from your organization and your programs shows up here."
      />
    </ph-card>
  }
} @else {
  <ph-card [flush]="true">
    <ph-empty-state
      icon="warning"
      tone="error"
      title="We couldn’t load your announcements"
      text="Check your connection and try again."
    >
      <ph-button variant="primary" (click)="load()">Try again</ph-button>
    </ph-empty-state>
  </ph-card>
}
