@if (session(); as s) {
  <ph-page-header
    [title]="'Welcome, ' + firstName()"
    [subtitle]="s.organizationName + ' · ' + today"
  />
  <ph-card [flush]="true">
    <ph-empty-state title="Nothing here yet" text="Import a roster to begin.">
      <ph-button variant="primary" link="/welcome" icon="arrow-right">Start setup</ph-button>
      <ph-button link="/import" icon="upload">Import a roster</ph-button>
    </ph-empty-state>
  </ph-card>
}
