<form novalidate (ngSubmit)="submit()">
  <ph-dialog
    [title]="'Invite ' + child.firstName + ' to PromiseHub'"
    [description]="
      'Their own email. The account links to ' +
      child.firstName +
      '’s record and signs in to Learning. The link lasts 14 days.'
    "
  >
    @if (failed()) {
      <ph-alert
        tone="danger"
        title="That didn’t go through"
        text="No invitation was sent. Try again."
      />
    }
    @if (errors()['childId']; as reason) {
      <ph-alert tone="danger" title="Can’t invite" [text]="reason" />
    }
    <ph-text-field
      inputId="invite-youth-email"
      [label]="child.firstName + '’s email'"
      type="email"
      name="email"
      autocomplete="off"
      help="Not a guardian’s email: this is their own sign-in."
      [error]="errors()['email'] ?? null"
      [(ngModel)]="email"
    />
    <ng-container ngProjectAs="[phDialogFooter]">
      <ph-button (click)="ref.close()">Cancel</ph-button>
      <ph-button variant="primary" type="submit" [busy]="busy()">Send invitation</ph-button>
    </ng-container>
  </ph-dialog>
</form>
