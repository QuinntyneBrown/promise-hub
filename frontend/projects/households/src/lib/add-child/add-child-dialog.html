<form novalidate (ngSubmit)="submit()">
  <ph-dialog
    [title]="'Add a child to the ' + household.name + ' household'"
    description="Guardians can add allergies and pickups from their link."
  >
    <ph-text-field
      inputId="name"
      label="Child’s name"
      name="name"
      [error]="errors()['name'] ?? null"
      [(ngModel)]="child.name"
    />
    <div class="two-col">
      <ph-text-field
        inputId="dateOfBirth"
        label="Date of birth"
        type="date"
        name="dateOfBirth"
        [error]="errors()['dateOfBirth'] ?? null"
        [(ngModel)]="child.dateOfBirth"
      />
      <ph-text-field
        inputId="school"
        label="School and grade"
        name="school"
        [optional]="true"
        [(ngModel)]="child.school"
      />
    </div>
    <ph-textarea
      inputId="allergies"
      label="Allergies and medical"
      name="allergies"
      [optional]="true"
      placeholder="Write “none” if there are none"
      [(ngModel)]="child.allergies"
    />
    <ng-container ngProjectAs="[phDialogFooter]">
      <ph-button (click)="ref.close()">Cancel</ph-button>
      <ph-button variant="primary" type="submit" [busy]="busy()">Add child</ph-button>
    </ng-container>
  </ph-dialog>
</form>
