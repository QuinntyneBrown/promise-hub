<ph-dialog [title]="'More actions for the ' + data.household.name + ' household'">
  <ph-action-menu label="Household actions" [items]="items" (selected)="choose($event)" />
  <ng-container ngProjectAs="[phDialogFooter]">
    <ph-button (click)="ref.close()">Close</ph-button>
  </ng-container>
</ph-dialog>
