<ph-page-header
  title="Curriculum"
  subtitle="Tracks, modules and lessons your youth work through."
/>
@let r = result();
@if (r === null) {
  <div aria-busy="true" aria-label="Loading tracks">
    <ph-skeleton shape="card" />
  </div>
} @else if (r.status === 'loaded') {
  <ph-card [flush]="true">
    <ph-empty-state
      icon="curriculum"
      title="No tracks yet"
      text="Tracks you write appear here, ready to publish to a program."
    ></ph-empty-state>
  </ph-card>
} @else {
  <ph-card [flush]="true">
    <ph-empty-state
      icon="warning"
      tone="error"
      title="We couldn’t load the curriculum"
      text="Check your connection and try again."
    >
      <ph-button variant="primary" (click)="reload()">Try again</ph-button>
    </ph-empty-state>
  </ph-card>
}
