<form novalidate (ngSubmit)="submit()">
  <ph-dialog
    [title]="'Submit “' + data.title + '”?'"
    description="Your mentor will review it. You can’t change it while it’s under review."
    icon="send"
  >
    <div class="stack">
      @if (failed()) {
        <ph-alert
          tone="danger"
          title="That didn’t go through"
          text="Your project was not sent. Try again."
        />
      }
      @if (errors()['code']; as e) {
        <ph-alert tone="danger" title="Your page isn’t ready yet" [text]="e" />
      }
      <ph-textarea
        inputId="note"
        label="Note to your mentor"
        name="note"
        [optional]="true"
        [rows]="3"
        help="Up to 1,000 characters."
        [error]="errors()['note'] ?? null"
        [(ngModel)]="note"
      />
    </div>
    <ng-container ngProjectAs="[phDialogFooter]">
      <ph-button (click)="ref.close()">Cancel</ph-button>
      <ph-button variant="primary" type="submit" [busy]="busy()">Submit for review</ph-button>
    </ng-container>
  </ph-dialog>
</form>
