@let r = result();
<ph-guardian-shell [organization]="r?.status === 'loaded' ? r.value.name : null">
  @if (r === null) {
    <div aria-busy="true" aria-label="Loading the page">
      <ph-skeleton shape="card" />
    </div>
  } @else if (r.status === 'loaded') {
    <ph-page-header [title]="r.value.name" [subtitle]="r.value.city" />
    <ph-card [flush]="true">
      <ph-empty-state
        icon="globe"
        title="Our pages are being written"
        text="Programs, open cohorts and ways to join appear here once they are published."
      />
    </ph-card>
  } @else if (r.status === 'not-found') {
    <ph-page-header title="Page not found" />
    <ph-card [flush]="true">
      <ph-empty-state
        icon="globe"
        title="This page isn’t here"
        text="Check the address, or ask the organization for its link."
      />
    </ph-card>
  } @else {
    <ph-page-header title="Public website" />
    <ph-card [flush]="true">
      <ph-empty-state
        icon="warning"
        tone="error"
        title="We couldn’t load this page"
        text="Check your connection and try again."
      />
    </ph-card>
  }
</ph-guardian-shell>
