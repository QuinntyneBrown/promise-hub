<ph-breadcrumb [items]="crumbs" />
<ph-page-header
  title="Launch"
  subtitle="One invitation per covered household, naming each eligible child, in the household’s language."
/>
@switch (state()) {
  @case ('forbidden') {
    <ph-card [flush]="true">
      <ph-empty-state
        icon="lock"
        title="Admins launch Learning Bond"
        text="Ask an admin or a program director."
      >
        <ph-button link="/">Back to Today</ph-button>
      </ph-empty-state>
    </ph-card>
  }
  @case ('error') {
    <ph-card [flush]="true">
      <ph-empty-state
        icon="warning"
        tone="error"
        title="We couldn’t load the launch"
        text="Check your connection and try again."
      >
        <ph-button variant="primary" icon="refresh" (click)="load()">Try again</ph-button>
        <ph-button variant="ghost" link="/settings/learning-bond">Back to Learning Bond</ph-button>
      </ph-empty-state>
    </ph-card>
  }
  @case ('loading') {
    <div class="counts" aria-busy="true" aria-label="Loading the launch">
      <ph-skeleton shape="card" />
      <ph-skeleton shape="card" />
      <ph-skeleton shape="card" />
      <ph-skeleton shape="card" />
    </div>
  }
  @default {
    @if (launch(); as l) {
      <div class="counts" data-testid="launch-counts">
        <ph-stat
          label="Households covered"
          [value]="'' + l.covered"
          [caption]="programsCaption(l)"
        />
        <ph-stat label="With a mobile number" [value]="'' + l.mobile" caption="Invited by text" />
        <ph-stat label="Email only" [value]="'' + l.emailOnly" caption="Invited by email" />
        <ph-stat label="Neither" [value]="'' + l.neither" caption="Collect at check-in" />
      </div>
      @if (l.neither > 0) {
        <p class="more">
          <ph-button
            variant="ghost"
            size="sm"
            link="/settings/learning-bond/launch/missing-contacts"
            >View households to collect from</ph-button
          >
        </p>
      }
      @if (l.noPhoneNumbers) {
        <div class="blocked">
          <p class="reason" id="launch-blocked" data-testid="launch-blocked">
            {{ noPhoneNumbers }}
          </p>
          <ph-button variant="primary" [disabled]="true" describedBy="launch-blocked"
            >Launch</ph-button
          >
        </div>
      }
    }
  }
}
