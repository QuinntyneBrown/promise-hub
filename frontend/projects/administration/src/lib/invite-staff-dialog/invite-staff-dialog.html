<form novalidate (ngSubmit)="submit()">
  <ph-dialog title="Invite staff" description="They get an email with a link that lasts 14 days.">
    @if (failed()) {
      <ph-alert
        tone="danger"
        title="That didn’t go through"
        text="No invitation was sent. Try again."
      />
    }
    <ph-text-field
      inputId="invite-email"
      label="Work email"
      type="email"
      name="email"
      autocomplete="email"
      [error]="errors()['email'] ?? null"
      [(ngModel)]="email"
    />
    <ph-radio-group
      legend="Role"
      name="role"
      [options]="roles"
      [error]="errors()['role'] ?? null"
      [(ngModel)]="role"
    />
    <ng-container ngProjectAs="[phDialogFooter]">
      <ph-button (click)="ref.close()">Cancel</ph-button>
      <ph-button variant="primary" type="submit" [busy]="busy()">Send invitation</ph-button>
    </ng-container>
  </ph-dialog>
</form>
