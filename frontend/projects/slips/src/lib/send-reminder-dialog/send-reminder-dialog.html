<form novalidate (ngSubmit)="send()">
  <ph-dialog
    [title]="'Text the ' + data.families.length + ' unsigned'"
    description="Each family gets its own slip link again."
  >
    @if (failed()) {
      <ph-alert tone="danger" title="That didn’t go through" text="Nothing was sent. Try again." />
    }
    <ph-list label="Families to remind">
      @for (f of data.families; track f.householdId) {
        <ph-list-item [title]="f.guardian ?? f.household" [meta]="meta(f)">
          @if (!f.reachable) {
            <ph-badge tone="danger">Can’t reach</ph-badge>
          }
        </ph-list-item>
      }
    </ph-list>
    <ph-textarea
      inputId="reminder-body"
      label="Message"
      name="body"
      [rows]="3"
      help="{child} and {link} fill in per family."
      [error]="errors()['body'] ?? null"
      [(ngModel)]="body"
    />
    <ng-container ngProjectAs="[phDialogFooter]">
      <ph-button (click)="ref.close()">Cancel</ph-button>
      <ph-button variant="primary" type="submit" icon="messages" [busy]="busy()"
        >Send to {{ reachable() }}</ph-button
      >
    </ng-container>
  </ph-dialog>
</form>
