# Scaffold only. Overwrite or delete as implementation requires.
name: Scaffold checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore backend/PromiseHub.sln
      - run: dotnet build backend/PromiseHub.sln --no-restore
      - run: dotnet format backend/PromiseHub.sln --verify-no-changes --no-restore
      # No tests yet; this verifies that the empty test projects load.
      - run: dotnet test backend/PromiseHub.sln --no-build
